[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = [
  "python3.12 -m pip install --upgrade pip",
  "python3.12 -m pip install -r requirements.txt",
]

[phases.build]
cmds = ["python3.12 assistant.py download-files"]

[start]
cmd = "python3.12 assistant.py start"
